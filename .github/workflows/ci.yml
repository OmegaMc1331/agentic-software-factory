name: Integrated qualification

on:
  push:
    branches: [main, codex/v2-p14-release-qualification]
  pull_request:
  workflow_dispatch:
    inputs:
      retain_artifacts:
        description: Retain native candidate packages in this authorized Actions run
        type: boolean
        default: false
  workflow_call:
    inputs:
      retain_artifacts:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - run: python -B scripts/v2_p14/ci.py install-npm
      - run: python -B scripts/v2_p14/ci.py npm-ci
      - run: python -B scripts/v2_p14/ci.py frontend
      - run: python -B scripts/v2_p14/ci.py frontend-tests
      - run: python -B scripts/v2_p14/ci.py contracts

  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: factory-windows-x86_64.zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: factory-linux-x86_64.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: factory-macos-aarch64.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: factory-macos-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Verify native host and pinned Rust
        run: python -B scripts/v2_p14/ci.py host --target ${{ matrix.target }}
      - run: python -B scripts/v2_p14/ci.py install-npm
      - run: python -B scripts/v2_p14/ci.py npm-ci
      - run: python -B scripts/v2_p14/ci.py frontend-build
      - run: python -B scripts/v2_p14/ci.py rust
      - run: python -B scripts/v2_p14/ci.py normal
      - run: python -B scripts/v2_p14/ci.py contracts
      - run: python -B scripts/v2_p14/ci.py build
      - run: python -B scripts/v2_p14/ci.py embedded-tests
      - name: Package actual native executable
        run: python -B scripts/v2_p14/ci.py native-package --target ${{ matrix.target }}
      - name: Test unpacked package outside checkout
        run: python -B scripts/v2_p14/ci.py native-smoke
      - name: Independently verify archive checksum
        run: python -B scripts/v2_p14/ci.py native-checksum --target ${{ matrix.target }}
      - name: Screen native package contents
        run: python -B scripts/v2_p14/ci.py stage-native --target ${{ matrix.target }}
      - name: Reverify sealed native upload bytes
        id: native_privacy
        run: python -B scripts/v2_p14/ci.py approve-native --target ${{ matrix.target }}
      - name: Retain screened native package
        if: success() && steps.native_privacy.outputs.approved == 'true' && (inputs.retain_artifacts || (github.event_name == 'push' && github.ref == 'refs/heads/codex/v2-p14-release-qualification'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-native-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/asf-p14/public/${{ matrix.archive }}
            ${{ runner.temp }}/asf-p14/public/${{ matrix.archive }}.sha256
            ${{ runner.temp }}/asf-p14/public/privacy-receipt.json
          if-no-files-found: error
          retention-days: 14

  integrity:
    needs: native
    if: inputs.retain_artifacts || (github.event_name == 'push' && github.ref == 'refs/heads/codex/v2-p14-release-qualification')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: candidate-native-*-${{ github.sha }}
          path: ${{ runner.temp }}/asf-p14/private/downloaded
      - name: Verify native identities and assemble exact inventory
        run: python -B scripts/v2_p14/ci.py assemble
      - name: Verify the exact release artifact inventory
        run: python -B scripts/v2_p14/ci.py verify-inventory
      - name: Generate and verify the consolidated manifest
        run: python -B scripts/v2_p14/ci.py finalize-inventory
      - name: Independently verify consolidated manifest
        run: python -B scripts/v2_p14/ci.py inventory-checksum
      - name: Stage verified archive and checksum inventory
        run: python -B scripts/v2_p14/ci.py stage-inventory
      - name: Reverify sealed inventory upload bytes
        id: inventory_privacy
        run: python -B scripts/v2_p14/ci.py approve-inventory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && steps.inventory_privacy.outputs.approved == 'true'
        with:
          name: verified-candidate-inventory-${{ github.sha }}
          path: |
            ${{ runner.temp }}/asf-p14/public/factory-windows-x86_64.zip
            ${{ runner.temp }}/asf-p14/public/factory-windows-x86_64.zip.sha256
            ${{ runner.temp }}/asf-p14/public/factory-linux-x86_64.tar.gz
            ${{ runner.temp }}/asf-p14/public/factory-linux-x86_64.tar.gz.sha256
            ${{ runner.temp }}/asf-p14/public/factory-macos-aarch64.tar.gz
            ${{ runner.temp }}/asf-p14/public/factory-macos-aarch64.tar.gz.sha256
            ${{ runner.temp }}/asf-p14/public/factory-macos-x86_64.tar.gz
            ${{ runner.temp }}/asf-p14/public/factory-macos-x86_64.tar.gz.sha256
            ${{ runner.temp }}/asf-p14/public/SHA256SUMS.txt
            ${{ runner.temp }}/asf-p14/public/privacy-receipt.json
          if-no-files-found: error
          retention-days: 14

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - run: python -B scripts/v2_p14/ci.py install-npm
      - run: python -B scripts/v2_p14/ci.py npm-ci
      - run: python -B scripts/v2_p14/ci.py npm-audit
      - run: python -B scripts/v2_p14/ci.py dependencies

  browsers:
    needs: native
    if: inputs.retain_artifacts || (github.event_name == 'push' && github.ref == 'refs/heads/codex/v2-p14-release-qualification')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-native-x86_64-unknown-linux-gnu-${{ github.sha }}
          path: ${{ runner.temp }}/asf-p14/private/downloaded-linux
      - name: Unpack verified native application
        run: python -B scripts/v2_p14/ci.py browser-unpack
      - run: python -B scripts/v2_p14/ci.py install-npm
      - run: python -B scripts/v2_p14/ci.py npm-ci
      - run: python -B scripts/v2_p14/ci.py playwright-install
      - run: python -B scripts/v2_p14/ci.py browser --engine ${{ matrix.engine }}
