[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/OmegaMc1331/agentic-software-factory"

[workspace.dependencies]
factory-proc = { path = "crates/factory-proc" }
factory-types = { path = "crates/factory-types" }
factory-agent = { path = "crates/factory-agent" }
factory-context = { path = "crates/factory-context" }
factory-policy = { path = "crates/factory-policy" }
factory-db = { path = "crates/factory-db" }
factory-git = { path = "crates/factory-git" }
factory-core = { path = "crates/factory-core" }
factory-api = { path = "crates/factory-api" }
factory-runtime = { path = "crates/factory-runtime" }
factory-github = { path = "crates/factory-github" }
factory-eval = { path = "crates/factory-eval" }
factory-mcp = { path = "crates/factory-mcp" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
fs4 = { version = "1", features = ["sync"] }

[profile.release]
lto = true
