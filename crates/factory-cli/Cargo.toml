[package]
name = "factory-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "factory"
path = "src/main.rs"

[features]
embedded-dashboard = ["factory-api/embedded-dashboard"]

[dependencies]
factory-core = { workspace = true }
factory-db = { workspace = true }
factory-types = { workspace = true }
factory-api = { workspace = true }
factory-mcp = { workspace = true }
factory-policy = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[dev-dependencies]
tempfile = "3"
