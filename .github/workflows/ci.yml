name: Integrated qualification

on:
  push:
    branches: [main, codex/v2-p14-release-qualification]
  pull_request:
  workflow_dispatch:
    inputs:
      retain_artifacts:
        description: Retain native candidate packages in this authorized Actions run
        type: boolean
        default: false
  workflow_call:
    inputs:
      retain_artifacts:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - run: npm install --global --ignore-scripts npm@12.0.2
      - run: npm ci
        working-directory: apps/dashboard
      - run: python -B scripts/v2_p14/run.py frontend --output .factory/v2/p14/frontend
      - run: python -B scripts/v2_p14/run.py frontend-tests --output .factory/v2/p14/frontend
      - run: python -B scripts/v2_p14/run.py contracts --output .factory/v2/p14/frontend

  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: factory-windows-x86_64.zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: factory-linux-x86_64.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: factory-macos-aarch64.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: factory-macos-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - name: Verify native host and pinned Rust
        run: python -B scripts/v2_p14/package.py host --target ${{ matrix.target }}
      - run: npm install --global --ignore-scripts npm@12.0.2
      - run: npm ci
        working-directory: apps/dashboard
      - run: npm run build
        working-directory: apps/dashboard
      - run: python -B scripts/v2_p14/run.py rust --output .factory/v2/p14/native
      - run: python -B scripts/v2_p14/run.py normal --output .factory/v2/p14/native
      - run: python -B scripts/v2_p14/run.py contracts --output .factory/v2/p14/native
      - run: python -B scripts/v2_p14/run.py build --output .factory/v2/p14/native
      - run: python -B scripts/v2_p14/run.py embedded-tests --output .factory/v2/p14/native
      - name: Package actual native executable
        run: python -B scripts/v2_p14/package.py build --target ${{ matrix.target }} --output .factory/v2/p14/packages
      - name: Test unpacked package outside checkout
        run: python -B scripts/v2_p14/smoke.py --package-dir .factory/v2/p14/packages --output .factory/v2/p14/native/packaged-smoke.json
      - name: Independently verify archive checksum
        run: node scripts/release-checksums.mjs verify .factory/v2/p14/packages/${{ matrix.archive }}
      - name: Retain explicitly requested candidate evidence
        if: (inputs.retain_artifacts || (github.event_name == 'push' && github.ref == 'refs/heads/codex/v2-p14-release-qualification')) && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-${{ matrix.target }}-${{ github.sha }}
          path: .factory/v2/p14/
          if-no-files-found: error
          retention-days: 14

  integrity:
    needs: native
    if: inputs.retain_artifacts || (github.event_name == 'push' && github.ref == 'refs/heads/codex/v2-p14-release-qualification')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: candidate-*-${{ github.sha }}
          path: .factory/v2/p14/downloaded
      - name: Verify native identities and assemble exact inventory
        run: python -B scripts/v2_p14/assemble.py --input .factory/v2/p14/downloaded --output .factory/v2/p14/assembled --source ${{ github.sha }}
      - name: Verify the exact release artifact inventory
        run: node scripts/release-checksums.mjs verify-release .factory/v2/p14/assembled
      - name: Generate and verify the consolidated manifest
        run: node scripts/release-checksums.mjs finalize-release .factory/v2/p14/assembled
      - name: Independently verify consolidated manifest
        run: sha256sum -c SHA256SUMS.txt
        working-directory: .factory/v2/p14/assembled
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-candidate-inventory-${{ github.sha }}
          path: .factory/v2/p14/assembled/
          if-no-files-found: error
          retention-days: 14

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - run: npm install --global --ignore-scripts npm@12.0.2
      - run: npm ci
        working-directory: apps/dashboard
      - run: npm audit --audit-level=high
        working-directory: apps/dashboard
      - run: python -B scripts/v2_p14/dependencies.py --output .factory/v2/p14/dependencies

  browsers:
    needs: native
    if: inputs.retain_artifacts || (github.event_name == 'push' && github.ref == 'refs/heads/codex/v2-p14-release-qualification')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      ASF_BROWSER_ENGINE: ${{ matrix.engine }}
      ASF_P13_BINARY: ${{ github.workspace }}/.factory/v2/p14/browser-package/factory
      ASF_P13_OUTPUT: ${{ github.workspace }}/.factory/v2/p14/browsers/${{ matrix.engine }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.5'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-x86_64-unknown-linux-gnu-${{ github.sha }}
          path: .factory/v2/p14/downloaded-linux
      - name: Unpack verified native application
        run: python -B -c "import sys; from pathlib import Path; sys.path.insert(0, 'scripts/v2_p14'); from package import unpack; unpack(Path('.factory/v2/p14/downloaded-linux/packages/factory-linux-x86_64.tar.gz'), Path('.factory/v2/p14/browser-package'))"
      - run: npm install --global --ignore-scripts npm@12.0.2
      - run: npm ci
        working-directory: apps/dashboard
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/dashboard
      - run: node scripts/v2_p13/browser.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: candidate-browser-${{ matrix.engine }}-${{ github.sha }}
          path: .factory/v2/p14/browsers/
          if-no-files-found: error
          retention-days: 14
