[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OmegaMc1331/agentic-software-factory"

[workspace.dependencies]
factory-models = { path = "crates/factory-models" }
factory-db = { path = "crates/factory-db" }
factory-git = { path = "crates/factory-git" }
factory-core = { path = "crates/factory-core" }
factory-api = { path = "crates/factory-api" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true