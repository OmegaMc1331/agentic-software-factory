[package]
name = "asf-p01-ide-probe"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[features]
embedded-assets = ["dep:rust-embed"]

[dependencies]
factory-core = { path = "../../../crates/factory-core" }
factory-runtime = { path = "../../../crates/factory-runtime" }
factory-proc = { path = "../../../crates/factory-proc" }
axum = { version = "=0.7.9", features = ["ws"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "=0.5.2", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
url = "2"
tempfile = "3"
rust-embed = { version = "8", features = ["mime-guess"], optional = true }

[profile.release]
lto = false
strip = true
