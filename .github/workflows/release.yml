name: Release candidate qualification (no publication)

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Enter QUALIFY ONLY to acknowledge native CI and Actions artifact retention
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    if: inputs.authorization == 'QUALIFY ONLY'
    uses: ./.github/workflows/ci.yml
    with:
      retain_artifacts: true
