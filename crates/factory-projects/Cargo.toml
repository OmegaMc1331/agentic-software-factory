[package]
name = "factory-projects"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
factory-conversation.workspace = true
factory-core.workspace = true
factory-db.workspace = true
factory-git.workspace = true
factory-runtime.workspace = true
factory-files.workspace = true
factory-ide.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
rand = "0.8"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
