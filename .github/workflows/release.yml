name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            archive: factory-windows-x86_64.zip
            binary: factory.exe
            is_windows: true
          - os: ubuntu-latest
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            archive: factory-linux-x86_64.tar.gz
            binary: factory
            is_windows: false
          - os: macos-14
            name: macos-aarch64
            target: aarch64-apple-darwin
            archive: factory-macos-aarch64.tar.gz
            binary: factory
            is_windows: false
          - os: macos-14
            name: macos-x86_64
            target: x86_64-apple-darwin
            archive: factory-macos-x86_64.tar.gz
            binary: factory
            is_windows: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Build the dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build

      - name: Install Rust (target ${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build the release binary with the embedded dashboard
        run: cargo build --release --features embedded-dashboard -p factory-cli --target ${{ matrix.target }}

      - name: Run the embedded dashboard tests
        run: cargo test --release --features embedded-dashboard -p factory-api

      - name: Verify the dashboard assets are embedded in the binary
        shell: bash
        run: |
          if ! grep -aq 'id="root"' "target/${{ matrix.target }}/release/${{ matrix.binary }}"; then
            echo "embedded dashboard marker not found in the binary" >&2
            exit 1
          fi
          echo "OK: dashboard assets embedded"

      - name: Smoke test a standalone copy of the binary
        if: matrix.is_windows == false
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$dir/factory"
          cd "$dir"
          ./factory --version | grep -q factory
          ./factory init
          ./factory start --no-browser &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            curl --max-time 2 -fsS http://127.0.0.1:4321/api/health >factory-health.json 2>/dev/null && break
            sleep 0.2
          done
          python3 -c 'import json; assert json.load(open("factory-health.json"))["status"] == "ok"'
          curl --max-time 2 -fsS http://127.0.0.1:4321/api/runs >factory-runs.json
          python3 -c 'import json; assert isinstance(json.load(open("factory-runs.json")), list)'
          curl -fsS http://127.0.0.1:4321/ | grep -q 'id="root"'
          echo "OK: standalone binary serves health, runs, and the embedded dashboard"

      - name: Smoke test a standalone copy of the binary (Windows)
        if: matrix.is_windows == true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP "factory-smoke-${{ matrix.name }}"
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" (Join-Path $dir "${{ matrix.binary }}")
          $exe = Join-Path $dir "${{ matrix.binary }}"
          $proc = $null
          try {
              & $exe --version | Out-Null
              & $exe init | Out-Null
              $proc = Start-Process -FilePath $exe -ArgumentList 'start','--no-browser' -PassThru
              $health = $null
              $ok = $false
              for ($i = 0; $i -lt 50; $i++) {
                  try {
                      $resp = Invoke-WebRequest -Uri 'http://127.0.0.1:4321/api/health' -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
                      $health = $resp.Content | ConvertFrom-Json
                      if ($resp.StatusCode -eq 200 -and $health.status -eq 'ok') { $ok = $true; break }
                  } catch { Start-Sleep -Milliseconds 200 }
              }
              if (-not $ok) { throw 'Factory API health endpoint did not become ready on 127.0.0.1:4321' }

              $runsResponse = Invoke-WebRequest -Uri 'http://127.0.0.1:4321/api/runs' -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
              $runsResponse.Content | ConvertFrom-Json | Out-Null
              if ($runsResponse.StatusCode -ne 200 -or $runsResponse.Content.TrimStart() -notmatch '^\[') {
                  throw 'Factory API runs endpoint did not return a JSON array'
              }

              $dashboard = Invoke-WebRequest -Uri 'http://127.0.0.1:4321/' -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
              if ($dashboard.StatusCode -ne 200 -or $dashboard.Content -notmatch 'id="root"') {
                  throw 'embedded dashboard marker not found'
              }
              Write-Output 'OK: standalone binary serves health, runs, and the embedded dashboard'
          } finally {
              if ($null -ne $proc) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
              Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Package the archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          if [ "${{ matrix.is_windows }}" = "true" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'target/${{ matrix.target }}/release/${{ matrix.binary }}', 'LICENSE' -DestinationPath 'release/${{ matrix.archive }}' -Force"
          else
            tar -czf "release/${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" "${{ matrix.binary }}" -C "$GITHUB_WORKSPACE" LICENSE
          fi

      - name: Verify the Windows archive contents
        if: matrix.is_windows == true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $check = Join-Path $env:RUNNER_TEMP "factory-release-check"
          Remove-Item $check -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path "release/${{ matrix.archive }}" -DestinationPath $check -Force

          if (-not (Test-Path (Join-Path $check "${{ matrix.binary }}"))) {
              throw "${{ matrix.binary }} missing from Windows archive"
          }
          if (-not (Test-Path (Join-Path $check "LICENSE"))) {
              throw "LICENSE missing from Windows archive"
          }

          Remove-Item $check -Recurse -Force -ErrorAction SilentlyContinue
          echo "OK: Windows archive contents verified"

      - name: Verify the tar.gz archive contents
        if: matrix.is_windows == false
        shell: bash
        run: |
          set -euo pipefail
          contents="$(mktemp)"
          tar -tzf "release/${{ matrix.archive }}" > "$contents"
          grep -q "${{ matrix.binary }}" -x "$contents"
          grep -q "LICENSE" -x "$contents"
          rm -f "$contents"
          echo "OK: archive contents verified"

      - name: Generate and verify the SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-checksums.mjs generate "release/${{ matrix.archive }}"
          node scripts/release-checksums.mjs verify "release/${{ matrix.archive }}"

      - name: Upload the release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            release/${{ matrix.archive }}
            release/${{ matrix.archive }}.sha256
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Verify the exact release artifact inventory
        run: |
          set -euo pipefail
          node scripts/release-checksums.mjs verify-release release

      - name: Verify all archive contents
        run: |
          set -euo pipefail
          cd release
          windows_list="$(mktemp)"
          unzip -Z1 factory-windows-x86_64.zip > "$windows_list"
          grep -qx factory.exe "$windows_list"
          grep -qx LICENSE "$windows_list"
          rm -f "$windows_list"

          linux_list="$(mktemp)"
          tar -tzf factory-linux-x86_64.tar.gz > "$linux_list"
          grep -qx factory "$linux_list"
          grep -qx LICENSE "$linux_list"
          rm -f "$linux_list"

          macos_aarch64_list="$(mktemp)"
          tar -tzf factory-macos-aarch64.tar.gz > "$macos_aarch64_list"
          grep -qx factory "$macos_aarch64_list"
          grep -qx LICENSE "$macos_aarch64_list"
          rm -f "$macos_aarch64_list"

          macos_x86_64_list="$(mktemp)"
          tar -tzf factory-macos-x86_64.tar.gz > "$macos_x86_64_list"
          grep -qx factory "$macos_x86_64_list"
          grep -qx LICENSE "$macos_x86_64_list"
          rm -f "$macos_x86_64_list"

          echo "OK: all archive contents verified"

      - name: Generate and verify the consolidated manifest
        run: |
          set -euo pipefail
          node scripts/release-checksums.mjs finalize-release release

      - name: Verify the consolidated manifest with sha256sum
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS.txt
          expected="$(wc -l < ../scripts/release-artifacts.txt)"
          actual="$(wc -l < SHA256SUMS.txt)"
          test "$actual" -eq "$expected"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease="--prerelease"
          fi
          assets=()
          while IFS= read -r archive; do
            assets+=("release/$archive" "release/$archive.sha256")
          done < scripts/release-artifacts.txt
          assets+=("release/SHA256SUMS.txt")
          gh release create "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Agentic Software Factory $GITHUB_REF_NAME" \
            --notes "Prebuilt binaries for Windows (x86_64), Linux (x86_64), macOS Apple Silicon and macOS Intel. SHA-256 checksums are included." \
            $prerelease
