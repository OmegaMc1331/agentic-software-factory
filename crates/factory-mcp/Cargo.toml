[package]
name = "factory-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
factory-types = { workspace = true }
factory-policy = { workspace = true }
factory-db = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
rmcp = { version = "3.1.4", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
url = "2"
http = "1"
jsonschema = { version = "0.50", default-features = false }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
